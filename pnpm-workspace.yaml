packages:
  - apps/*
  - packages/*
  - tools/*
  - packages/ui/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.7
  "@types/react-dom": ^19.2.3
  "@ionic/react": ^8.8.15
  "@ionic/react-router": ^8.8.15
  ionicons: ^8.0.13
  react-router: 5.3.4
  react-router-dom: 5.3.4
  "@types/react-router-dom": 5.3.3
  "vite-plugin-pwa": "^1.0.0"
  "@vitejs/plugin-react": "^6.0.3"
  "@rolldown/plugin-babel": "^0.2.3"
  "@babel/core": "^7.29.7"
  "@types/babel__core": "^7.20.5"
  "babel-plugin-react-compiler": "^1.0.0"
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
